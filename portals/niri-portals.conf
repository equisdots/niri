# niri-portals.conf - xdg-desktop-portal backend selection for the niri session
#
# Installed as /usr/share/xdg-desktop-portal/niri-portals.conf (distro package),
# /usr/local/share/xdg-desktop-portal/niri-portals.conf (manual install), or as
# a per-user override at ~/.config/xdg-desktop-portal/niri-portals.conf.
#
# The filename must be <desktop>-portals.conf where <desktop> matches
# $XDG_CURRENT_DESKTOP, which the niri session sets to `niri`.
#
# Portals require niri to run as a session: use niri-session or a display
# manager. A bare `niri` process on a TTY does not provide the D-Bus and
# graphical-session plumbing they need.

[preferred]
# GNOME provides the screencast interface; GTK is the general fallback.
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;

# If nautilus is NOT installed, xdg-desktop-portal-gnome (>= 47.0) cannot offer
# a file chooser. Uncomment the next line to force the GTK chooser instead.
# org.freedesktop.impl.portal.FileChooser=gtk;

# Secret portal (browser passwords, keyring): one backend is enough.
org.freedesktop.impl.portal.Secret=oo7-portal;gnome-keyring;
